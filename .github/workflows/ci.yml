name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (TypeScript)
        run: npm run build
      - name: Format + lint + typecheck
        run: npm run check
      - name: Fixture load + public API surface (load/scroll/paint/select/copy/destroy)
        run: npx vitest run test/api
      - name: Unit / integration / property / stress
        run: npm test
      - name: Memory harness
        run: npm run test:memory
      - name: Bench smoke
        run: npm run bench:smoke
      - name: Pack dry-run (the npm tarball assembles)
        run: npm pack --dry-run
      - name: Browser rendering validation
        run: npx playwright install --with-deps chromium && npm run test:browser
      - name: Doc build
        run: npm run docs:build
